<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%" >
      <feDropShadow dx="0" dy="12" stdDeviation="34" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="16" fill="url(#g3)" />

  <!-- decorative shapes -->
  <path d="M0 420 C220 360, 380 360, 600 420 L600 520 L0 520 Z" fill="rgba(255,255,255,0.06)" />
  <circle cx="1240" cy="160" r="120" fill="rgba(255,255,255,0.05)" />

  <!-- mockup group (stacked products) -->
  <g transform="translate(980,100)" filter="url(#s3)">
    <rect x="0" y="0" width="300" height="360" rx="18" fill="#fff" />
    <rect x="26" y="32" width="248" height="160" rx="8" fill="url(#g3)" />
    <text x="150" y="240" text-anchor="middle" fill="#333" font-size="18" font-family="Arial">Custom Apparel</text>
  </g>

  <g transform="translate(1240,160) scale(0.9)" filter="url(#s3)">
    <rect x="0" y="0" width="160" height="176" rx="16" fill="#fff" />
    <circle cx="48" cy="56" r="40" fill="url(#g3)" />
    <text x="92" y="150" text-anchor="start" fill="#333" font-size="14" font-family="Arial">Photo Mug</text>
  </g>

  <!-- copy -->
  <g transform="translate(160,120)">
    <text x="0" y="0" fill="#fff" font-size="44" font-family="Arial" font-weight="700">Made by you, ready to wear.</text>
    <text x="0" y="56" fill="#fff" font-size="18" font-family="Arial" opacity="0.95">Upload images, add text, or choose a template — print-ready previews and easy ordering.</text>
  </g>

</svg>