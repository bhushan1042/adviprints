<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%" >
      <feDropShadow dx="0" dy="10" stdDeviation="28" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="16" fill="url(#g2)" />

  <!-- soft shapes -->
  <circle cx="1300" cy="100" r="140" fill="rgba(255,255,255,0.06)" />
  <ellipse cx="380" cy="360" rx="320" ry="100" fill="rgba(255,255,255,0.05)" />

  <!-- product mockup (poster) -->
  <g transform="translate(980,80)" filter="url(#s2)">
    <rect x="0" y="0" width="260" height="380" rx="12" fill="#fff" />
    <rect x="20" y="22" width="220" height="220" rx="6" fill="url(#g2)" />
    <text x="130" y="320" text-anchor="middle" fill="#333" font-size="18" font-family="Arial">Poster Print</text>
  </g>

  <!-- product mockup (hoodie) -->
  <g transform="translate(1240,120) scale(1.05)" filter="url(#s2)">
    <rect x="0" y="0" width="340" height="300" rx="18" fill="#fff" />
    <rect x="36" y="28" width="268" height="140" rx="8" fill="url(#g2)" />
    <text x="170" y="228" text-anchor="middle" fill="#333" font-size="18" font-family="Arial">Cozy Hoodie</text>
  </g>

  <!-- copy -->
  <g transform="translate(160,120)">
    <text x="0" y="0" fill="#fff" font-size="44" font-family="Arial" font-weight="700">Design. Print. Ship.</text>
    <text x="0" y="56" fill="#fff" font-size="18" font-family="Arial" opacity="0.95">From single orders to bulk runs — professional printing with color-accurate results.</text>
  </g>

</svg>